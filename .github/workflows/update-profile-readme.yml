name: Update profile README

on:
  schedule:
    - cron: "30 3 * * *" # Daily at 9:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Update latest public repositories
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Omkar20056
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          async function main() {
            const username = process.env.GITHUB_USERNAME;
            const response = await fetch(
              \`https://api.github.com/users/\${username}/repos?type=owner&sort=updated&per_page=100\`,
              {
                headers: {
                  Accept: 'application/vnd.github+json',
                  Authorization: \`Bearer \${process.env.GITHUB_TOKEN}\`,
                  'X-GitHub-Api-Version': '2022-11-28'
                }
              }
            );

            if (!response.ok) {
              throw new Error(\`GitHub API request failed: \${response.status} \${response.statusText}\`);
            }

            const repos = (await response.json())
              .filter(repo => !repo.private && !repo.fork)
              .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))
              .slice(0, 6);

            const body = repos.length
              ? repos.map(repo => {
                  const description = repo.description
                    ? repo.description.replace(/[\\r\\n]+/g, ' ').trim()
                    : 'No description added yet.';
                  const language = repo.language || 'Not specified';
                  return \`- [**\${repo.name}**](\${repo.html_url}) — \${description} (Language: \${language}, ⭐ \${repo.stargazers_count})\`;
                }).join('\n')
              : '_No public repositories found yet._';

            const start = '<!-- START_LATEST_REPOS -->';
            const end = '<!-- END_LATEST_REPOS -->';
            const readme = fs.readFileSync('README.md', 'utf8');

            const startIndex = readme.indexOf(start);
            const endIndex = readme.indexOf(end);
            if (startIndex === -1 || endIndex === -1 || endIndex < startIndex) {
              throw new Error('README markers not found or out of order; refusing to overwrite content.');
            }

            const before = readme.slice(0, startIndex + start.length);
            const after = readme.slice(endIndex);
            const next = \`\${before}\n\n\${body}\n\n_Last refreshed: \${new Date().toISOString().slice(0, 10)} UTC_\n\${after}\`;

            if (next !== readme) {
              fs.writeFileSync('README.md', next);
            }
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README is already up to date."
          else
            git commit -m "chore: refresh latest public repositories"
            git push
          fi
